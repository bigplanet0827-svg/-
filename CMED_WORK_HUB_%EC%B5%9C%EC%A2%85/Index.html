<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <title>CMED WORK HUB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#1b293a;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#102944,#174c77);color:#fff;padding:35px max(22px,calc((100vw - 1100px)/2)) 44px}
    .label{font-size:12px;letter-spacing:3px;opacity:.8;font-weight:700}.hero{margin:10px 0 8px;font-size:clamp(27px,4vw,39px);letter-spacing:-1px}.subtitle{color:#d2e3f3;font-size:14px;margin:0}
    .brand{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.logo{background:#fff;border-radius:15px;padding:14px 18px;display:flex;align-items:center}.logo img{display:block;width:min(220px,60vw);height:auto}
    main{max-width:1150px;padding:0 24px 64px;margin:-23px auto 0;position:relative}.toolbar{background:#fff;padding:17px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:16px;box-shadow:0 10px 36px #17375412}
    input{flex:1 1 240px;min-width:0;padding:12px 15px;border:1px solid #d9e1e9;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#397cb5;box-shadow:0 0 0 3px #c5e5ff}
    button{border:1px solid #dce5ee;background:white;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;color:#29435a}button:hover{background:#edf6ff}
    .status{font-size:12px;color:#607387}.groups{margin-top:32px;display:flex;flex-direction:column;gap:27px}.group-title{margin:0 0 14px;font-size:18px;letter-spacing:-.5px}.counter{font-size:12px;margin-left:8px;background:#e5eef6;color:#42637e;border-radius:99px;padding:3px 9px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}.card{text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px;min-height:91px;padding:16px;border:1px solid #e5ecf3;background:#fff;border-radius:15px;transition:.16s;box-shadow:0 3px 14px #183b5a08}
    .card:hover{transform:translateY(-2px);border-color:#90bcdf;box-shadow:0 9px 24px #183b5a18}.fav{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;background:#e9f3fb;border-radius:11px;color:#285a80;font-size:17px;font-weight:800}.fav img{width:24px;height:24px;object-fit:contain}
    .name{font-weight:800;font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}.desc{margin:0;color:#728294;font-size:12px;line-height:1.4;overflow-wrap:anywhere}.empty{background:#fff;border:1px dashed #cad6df;padding:30px;border-radius:14px;text-align:center;color:#67798c}
    footer{margin-top:26px;font-size:12px;color:#8291a0;text-align:center}@media(max-width:550px){main{padding-left:14px;padding-right:14px}.cards{grid-template-columns:1fr 1fr}.card{padding:11px;gap:8px}.fav{width:32px;height:32px}.fav img{width:19px;height:19px}.desc{font-size:11px}}
  </style>
</head>

  function load(){
    if(loading)return;loading=true;status.textContent='동기화 중…';
    google.script.run.withSuccessHandler(data=>{loading=false;groups=data.groups||[];render();const t=new Date(data.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});status.textContent='✓ 동기화 완료 · '+t;}).withFailureHandler(err=>{loading=false;status.textContent='동기화 실패 — 새로고침을 눌러 다시 시도하세요.';root.replaceChildren();const p=document.createElement('div');p.className='empty';p.textContent=err&&err.message?err.message:'서버 연결을 확인하세요.';root.append(p);}).getSites();
  }
  search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);
  load();setInterval(load,60000);
</script>
</body>
</html>
